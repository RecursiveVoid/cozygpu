    <title>cozygpu · assets</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #10131c;

        font: 13px monospace;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #hud {
        position: fixed;
        right: 8px;
        bottom: 8px;
        padding: 4px 8px;

        white-space: pre;
        pointer-events: none;
      }
      #progress {
        position: fixed;
        left: 25%;
        top: 50%;
        width: 50%;
        height: 6px;
        background: #222838;
      }
      #bar {
        width: 0;
        height: 100%;
        background: #7aa2ff;
      }
