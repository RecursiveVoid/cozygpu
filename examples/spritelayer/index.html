<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>cozygpu · sprite layer</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0d0d14;
        color: #c8d4f0;
        font: 13px monospace;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #hud {
        position: fixed;
        top: 8px;
        left: 8px;
        pointer-events: none;
        white-space: pre;
        line-height: 1.5;
        text-shadow: 0 1px 2px #000;
      }
      #modes {
        position: fixed;
        bottom: 8px;
        left: 8px;
        display: flex;
        gap: 6px;
      }
      #modes a {
        color: #c8d4f0;
        background: #1c1c2c;
        padding: 3px 8px;
        border-radius: 4px;
        text-decoration: none;
      }
      #modes a.on {
        background: #3a4a7a;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="hud">sprite layer</div>
    <nav id="modes"></nav>
    <script type="module" src="/build/examples/spritelayer/main.js"></script>
  </body>
</html>
